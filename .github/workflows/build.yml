name: Build source release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.3.11579264'
            - name: Check source release
        run: |
          python3 -B tools/check_release.py --write-manifest
          python3 -B tools/check_release.py
      - name: Build APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          python3 -B tools/build_android.py vpn --jobs 2
      - name: Keep APK and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: udp-aim-development-build
          path: dist/
          if-no-files-found: error
      - name: Keep compiler logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: build/*/build.log
          if-no-files-found: ignore
